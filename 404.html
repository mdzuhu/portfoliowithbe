<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Zuhaib's Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .error-card {
      max-width: 540px;
      width: 100%;
      padding: 3.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .error-code {
      font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 900;
      line-height: 1;
      color: var(--primary);
      text-shadow: 0 0 35px var(--primary-glow);
      letter-spacing: -2px;
      user-select: none;
    }

    .error-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }

    .error-desc {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 400px;
      line-height: 1.6;
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="error-page-wrapper">
    <div class="card error-card fade-in is-visible">
      <div class="error-code">404</div>
      <h1 class="error-title">Lost in Web</h1>
      <p class="error-desc">
        The page you are looking for does not exist, has been removed, or was typed incorrectly.
      </p>
      <div class="error-actions">
        <a href="/" class="btn submit-btn" style="text-decoration: none; width: auto; padding: 0.85rem 1.8rem;">
          Return Home
        </a>
      </div>
    </div>
  </div>

  <script>
    // Inherit the user's previously chosen theme
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
